# ==============================================================================
# SPEC (Source of Truth):
# - Workflow: Persistence CI & GitHub Packages Publisher (`festival-tap/persistence`).
# - Version Policy: Release version `1.0.0` across `com.festivaltap:persistence`,
#   `com.festivaltap:core-ports`, and `com.sugarcoatlabs` persistence engines.
# - Triggers: Runs on every push or pull request targeting `main`.
# - Runtime & Build: Uses `ubuntu-latest` with Eclipse Temurin JDK 24 and Maven
#   dependency caching (`actions/setup-java@v5`).
# - Credentials & Repositories: Generates `${MAVEN_SETTINGS}` (`/tmp/settings.xml`)
#   with `<server>` entries for `github-sugarcoat-labs` and `github-festival-tap`
#   using `${env.GITHUB_ACTOR}` and `${env.PACKAGES_TOKEN}` (`secrets.GH_PACKAGES_TOKEN`
#   falling back to `secrets.GITHUB_TOKEN`).
# - Verification & Publishing:
#     * All pushes and PRs targeting `main` run `mvn -B -s "${MAVEN_SETTINGS}" clean verify`.
#     * Pushes to `main` also run `mvn -B -s "${MAVEN_SETTINGS}" deploy -DskipTests`
#       to publish `com.festivaltap:persistence` (`1.0.0`) to GitHub Packages
#       (`[https://maven.pkg.github.com/festival-tap/persistence](https://maven.pkg.github.com/festival-tap/persistence)`).
# - Permissions: Requires `contents: read` and `packages: write`.
# ==============================================================================

name: Persistence CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

env:
  MAVEN_SETTINGS: /tmp/settings.xml

jobs:
  build-and-test:
    name: Build, Verify & Publish (JDK 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven settings for GitHub Packages
        run: |
          cat << 'EOF' > "${MAVEN_SETTINGS}"
          <settings>
            <servers>
              <server>
                <id>github-sugarcoat-labs</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>github-festival-tap</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and run unit tests
        run: mvn -B -s "${MAVEN_SETTINGS}" clean verify

      - name: Publish package to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mvn -B -s "${MAVEN_SETTINGS}" deploy -DskipTests