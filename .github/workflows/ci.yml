# ==============================================================================
# Workflow: Persistence CI & GitHub Packages Publisher
# Repository: festival-tap/persistence
# ==============================================================================
#
# Purpose:
#   Automates continuous integration and artifact publication for the pure-JDK
#   and AWS DynamoDB persistence adapters (com.festivaltap:persistence).
#
# Triggers:
#   - push (main): Runs full verification suite and publishes updated
#     SNAPSHOT/release artifacts to GitHub Packages.
#   - pull_request (main): Runs compilation and JUnit 5 integration tests
#     without publishing artifacts.
#
# Dependencies & Package Resolution:
#   - Resolves upstream contracts (`com.festivaltap:core-ports`) and storage
#     engines (`com.sugarcoatlabs:persistence-engines-*`) from GitHub Packages
#     using server IDs `github-festival-tap` and `github-sugarcoat-labs`.
# ==============================================================================

name: Persistence CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read
  packages: write

env:
  MAVEN_SETTINGS: /tmp/settings.xml

jobs:
  build-and-test:
    name: Build, Verify & Publish (JDK 24)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven settings for GitHub Packages
        run: |
          cat << EOF > "${MAVEN_SETTINGS}"
          <settings>
            <servers>
              <server>
                <id>github-festival-tap</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${PACKAGES_TOKEN}</password>
              </server>
              <server>
                <id>github-sugarcoat-labs</id>
                <username>${GITHUB_ACTOR}</username>
                <password>${PACKAGES_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          PACKAGES_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and run unit tests
        run: mvn -B -s "${MAVEN_SETTINGS}" clean verify

      - name: Publish package to GitHub Packages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mvn -B -s "${MAVEN_SETTINGS}" deploy -DskipTests
